<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCP — Chittoor Cyber Pulse</title>
  <meta name="description" content="CCP — Chittoor Cyber Pulse: Cyber Fraud Monitoring & Intelligence Dashboard, Chittoor District Police, Andhra Pradesh.">
  <meta name="theme-color" content="#0a1d3a">
  <meta property="og:title" content="CCP — Chittoor Cyber Pulse">
  <meta property="og:description" content="Cyber Fraud Monitoring & Intelligence Dashboard · Chittoor District Police">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1d3a'/%3E%3Cpath d='M32 9 14 16v13c0 12 7.7 22.4 18 26 10.3-3.6 18-14 18-26V16L32 9Z' fill='none' stroke='%2319b4d6' stroke-width='4'/%3E%3Cpath d='M21 33h6l3-8 4 15 3-7h6' fill='none' stroke='%23c9a34a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #0a1d3a; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f2f5f9; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: linear-gradient(180deg, #0a1d3a, #061428); color: #fff;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif; text-align: center; padding: 16px; z-index: 2;
      transition: opacity .3s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-size: clamp(20px, 4vw, 30px); font-weight: 800; }
    #loading p { margin: 0; color: #cfe0f5; font-size: 15px; }
    #loading .spin { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.2); border-top-color: #19b4d6; border-radius: 50%; animation: s .8s linear infinite; }
    #loading a { color: #c9a34a; font-size: 13px; margin-top: 10px; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spin"></div>
    <h1>CCP — Chittoor Cyber Pulse</h1>
    <p>Cyber Fraud Monitoring &amp; Intelligence Dashboard</p>
    <a id="direct" href="#" target="_top">Taking too long? Open the dashboard directly</a>
  </div>

  <!-- The live dashboard (Google Apps Script web app) -->
  <iframe id="app" title="CCP — Chittoor Cyber Pulse dashboard"
          allow="clipboard-write; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script>
    // ⬇ The "CCP Dashboard" deployment URL (Execute as: Me · Who has access: Anyone)
    var APP_URL = 'https://script.google.com/macros/s/AKfycbwVazDTduEgHPKuLErL7DBSw8-9BkZwa1wKHR2u4yy6ApbzjaEhZ-7S1MxOacV4PAyx/exec';

    var frame = document.getElementById('app');
    var loading = document.getElementById('loading');
    document.getElementById('direct').href = APP_URL;
    frame.addEventListener('load', function () { loading.className = 'done'; });
    frame.src = APP_URL;
  </script>
</body>
</html>
